<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mare — Talk to Mare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/talk.css">
</head>
<body class="talk-body">

<!-- ── Who's talking? ── -->
<div class="talk-picker" id="picker-view">
  <header class="talk-picker-topbar">
    <a href="/" class="talk-icon-btn" aria-label="Back" data-i18n-aria="talkBack">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="lang-switch" id="lang-switch" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="nl">NL</button>
    </div>
  </header>
  <h1 class="talk-picker-title" data-i18n="talkWhoIsTalking">Who's talking to Mare today?</h1>
  <div class="talk-child-grid" id="child-grid"></div>
  <p class="talk-picker-empty" id="no-children-msg" hidden>
    <span data-i18n="talkNoChildren">No children on this account yet.</span>
    <a href="/account.html" data-i18n="talkAddChildLink">Add one in My Account</a>
  </p>
</div>

<!-- ── The wood ── -->
<div class="talk-scene" id="talk-view" hidden>
  <div class="talk-backdrop"></div>
  <div class="talk-vignette"></div>

  <header class="talk-topbar">
    <button type="button" class="talk-icon-btn" id="leave-btn" aria-label="Leave" data-i18n-aria="talkLeave">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="talk-child-name" id="talk-child-name"></span>
    <button type="button" class="talk-icon-btn" id="captions-btn" aria-label="Show captions" data-i18n-aria="talkToggleCaptions">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main class="talk-stage">
    <button type="button" class="talk-orb-wrap" id="orb-btn" aria-label="Tap to talk" data-i18n-aria="talkTapToTalk">
      <span class="talk-orb-ring"></span>
      <span class="talk-orb"></span>
    </button>
    <p class="talk-state-label" id="state-label"></p>
  </main>

  <div class="talk-captions" id="captions-bar" hidden>
    <p class="talk-caption-line" id="caption-line"></p>
  </div>
</div>

<!-- Leave confirm -->
<div class="talk-modal-backdrop" id="leave-confirm" hidden>
  <div class="talk-modal-card">
    <p data-i18n="talkConfirmLeave">Say goodbye to Mare and go back?</p>
    <div class="talk-modal-actions">
      <button type="button" class="btn-ghost" id="leave-cancel-btn" data-i18n="accCancel">Cancel</button>
      <button type="button" class="btn-primary" id="leave-confirm-btn" data-i18n="talkLeaveConfirm">Yes, go back</button>
    </div>
  </div>
</div>

<div class="talk-loading" id="talk-loading">
  <div class="talk-loading-spinner"></div>
</div>

<script src="/js/i18n.js"></script>
<script src="/js/talk.js"></script>
</body>
</html>
