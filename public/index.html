<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mare — Whispering Woods of Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/day.css">
</head>
<body class="day auth-atmosphere">

<div class="bg-slideshow-wrap" id="bg-slideshow"></div>
<div class="bg-veil"></div>

<header class="topbar">
  <a href="/" class="brand" style="text-decoration:none;">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="28" height="28"><path d="M20 4c-7 0-13 6-13 14 0 9 8 15 13 18 5-3 13-9 13-18 0-8-6-14-13-14z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="17" r="3" fill="currentColor"/></svg>
    </span>
    <span class="brand-word" data-i18n="brand">Mare</span>
  </a>
  <nav class="topbar-actions">
    <div class="lang-switch" id="lang-switch" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="nl">NL</button>
    </div>
    <a href="/login.html" class="btn-ghost" data-i18n="showcaseLogin">Log in</a>
    <a href="/login.html?mode=signup" class="btn-primary" data-i18n="showcaseRegister">Register</a>
  </nav>
</header>

<main class="showcase-main">

  <section class="hero">
    <h1 data-i18n="heroTitle">Mare's Story Corner</h1>
    <p class="hero-sub" id="showcase-welcome"></p>
  </section>

  <section class="showcase-video-card" id="showcase-video-card">
    <div class="showcase-video-placeholder" id="showcase-video-placeholder">
      <span class="showcase-video-play" aria-hidden="true">▶</span>
      <p data-i18n="showcaseVideoComingSoon">A short film of the Whispering Woods is on its way.</p>
    </div>
    <video class="showcase-video-player" id="showcase-video-player" controls hidden playsinline></video>
  </section>

  <section class="showcase-tile-grid" id="showcase-tiles" aria-label="Sample the Whispering Woods">
    <!-- tiles injected here -->
  </section>

  <section class="showcase-browse">
    <a href="/library.html" class="btn-ghost btn-full" style="max-width:320px;margin:0 auto;display:block;" data-i18n="showcaseBrowseAll">Browse all stories</a>
  </section>

</main>

<!-- Talk to Mare demo modal -->
<div class="admin-modal-backdrop showcase-talk-modal" id="talk-demo-modal" hidden>
  <div class="admin-modal-card showcase-talk-card">
    <div class="showcase-talk-bubble" id="talk-demo-phrase"></div>
    <p class="showcase-talk-note" data-i18n="showcaseTalkDemoNote">A little of what Mare sounds like — sign in to have a real conversation with her.</p>
    <div class="admin-modal-btns">
      <button type="button" class="btn-ghost" id="talk-demo-close-btn" data-i18n="adminClose">Close</button>
      <a href="/login.html?mode=signup" class="btn-primary" data-i18n="showcaseRegister">Register</a>
    </div>
  </div>
</div>

<footer class="wood-horizon" aria-hidden="true">
  <svg viewBox="0 0 1200 140" preserveAspectRatio="none" class="horizon-svg">
    <path d="M0,140 L0,80 C60,40 90,100 150,70 C210,40 240,90 300,60 C360,30 390,95 450,65 C510,35 540,100 600,70 C660,40 690,90 750,60 C810,30 840,95 900,65 C960,35 990,100 1050,70 C1110,40 1140,90 1200,60 L1200,140 Z" fill="#1D3327"/>
    <path d="M0,140 L0,100 C80,70 120,120 200,95 C280,70 320,115 400,90 C480,65 520,120 600,95 C680,70 720,115 800,90 C880,65 920,120 1000,95 C1080,70 1120,115 1200,90 L1200,140 Z" fill="#0B1712"/>
  </svg>
  <div class="firefly f1"></div>
  <div class="firefly f2"></div>
  <div class="firefly f3"></div>
  <div class="firefly f4"></div>
</footer>

<div class="social-footer" id="social-footer" hidden></div>

<script src="/js/i18n.js"></script>
<script src="/js/mare-helper-widget.js"></script>
<script src="/js/bg-slideshow.js"></script>
<script src="/js/showcase.js"></script>
<script>window.MareBgSlideshow.init('bg-slideshow', ['/images/mare-front-cover.jpg', '/images/mare-back-cover.jpg']);</script>
</body>
</html>
