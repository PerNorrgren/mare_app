<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mare — Story Corner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="28" height="28"><path d="M20 4c-7 0-13 6-13 14 0 9 8 15 13 18 5-3 13-9 13-18 0-8-6-14-13-14z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="17" r="3" fill="currentColor"/></svg>
    </span>
    <span class="brand-word" data-i18n="brand">Mare</span>
  </div>
  <nav class="topbar-actions" id="topbar-actions">
    <div class="lang-switch" id="lang-switch" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="nl">NL</button>
    </div>
    <a href="/login.html" class="btn-ghost" id="account-link" data-i18n="parentNavLabel">Parent</a>
  </nav>
</header>

<main>
  <section class="hero">
    <h1 data-i18n="heroTitle">Mare's Story Corner</h1>
    <p class="hero-sub" data-i18n="heroSub">Pick a story. The wood is listening.</p>
  </section>

  <section class="shelf" aria-label="Stories">
    <div class="shelf-grid" id="books-grid">
      <!-- book cards injected here -->
    </div>
  </section>

  <section class="extras" aria-label="More from Mare">
    <button class="extra-tile extra-club" id="tile-club" type="button">
      <span class="extra-icon" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="26" height="26"><path d="M20 4l4.5 10.2L35 15.5l-8 7.6 2.1 11L20 28.8 10.9 34.1 13 23.1 5 15.5l10.5-1.3z" fill="currentColor"/></svg>
      </span>
      <span class="extra-label" data-i18n="clubMare">Club Mare</span>
      <span class="extra-sub" data-i18n="clubMareSub">New stories, just for members</span>
    </button>
    <button class="extra-tile extra-shop" id="tile-shop" type="button">
      <span class="extra-icon" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="26" height="26"><path d="M10 15h20l-2 18H12l-2-18z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14 15v-2a6 6 0 0112 0v2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </span>
      <span class="extra-label" data-i18n="maresShop">Mare's Shop</span>
      <span class="extra-sub" data-i18n="maresShopSub">Bring the wood home</span>
    </button>
  </section>
</main>

<footer class="wood-horizon" aria-hidden="true">
  <svg viewBox="0 0 1200 140" preserveAspectRatio="none" class="horizon-svg">
    <path d="M0,140 L0,80 C60,40 90,100 150,70 C210,40 240,90 300,60 C360,30 390,95 450,65 C510,35 540,100 600,70 C660,40 690,90 750,60 C810,30 840,95 900,65 C960,35 990,100 1050,70 C1110,40 1140,90 1200,60 L1200,140 Z" fill="#1D3327"/>
    <path d="M0,140 L0,100 C80,70 120,120 200,95 C280,70 320,115 400,90 C480,65 520,120 600,95 C680,70 720,115 800,90 C880,65 920,120 1000,95 C1080,70 1120,115 1200,90 L1200,140 Z" fill="#0B1712"/>
  </svg>
  <div class="firefly f1"></div>
  <div class="firefly f2"></div>
  <div class="firefly f3"></div>
  <div class="firefly f4"></div>
</footer>

<div class="social-footer" id="social-footer" hidden></div>

<div class="modal-backdrop" id="login-prompt" hidden>
  <div class="modal-card">
    <p data-i18n="signInPrompt">You'll need to sign in as a parent or teacher first.</p>
    <div class="modal-actions">
      <a href="/login.html" class="btn-primary" data-i18n="signIn">Sign in</a>
      <button type="button" class="btn-ghost" id="close-prompt" data-i18n="notNow">Not now</button>
    </div>
  </div>
</div>

<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
