<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mare — Riddles from the Whispering Forest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/day.css">
</head>
<body class="day auth-atmosphere">

<div class="bg-slideshow-wrap" id="bg-slideshow"></div>
<div class="bg-veil"></div>

<header class="topbar">
  <a href="/" class="brand" style="text-decoration:none;">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="28" height="28"><path d="M20 4c-7 0-13 6-13 14 0 9 8 15 13 18 5-3 13-9 13-18 0-8-6-14-13-14z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="17" r="3" fill="currentColor"/></svg>
    </span>
    <span class="brand-word" data-i18n="brand">Mare</span>
  </a>
  <nav class="topbar-actions">
    <div class="lang-switch" id="lang-switch" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="nl">NL</button>
    </div>
    <a href="/" class="btn-ghost" data-i18n="navHomeLabel">Home</a>
    <a href="/login.html" class="btn-ghost" id="login-link" data-i18n="showcaseLogin">Log in</a>
    <a href="/login.html?mode=signup" class="btn-primary" id="register-link" data-i18n="showcaseRegister">Register</a>
    <button type="button" class="btn-ghost" id="topbar-signout-btn" data-i18n="teacherSignOut" hidden>Sign out</button>
  </nav>
</header>

<main class="shop-main riddle-main">

  <section class="hero">
    <h1 data-i18n="riddleHeroTitle">Riddles from the Whispering Forest</h1>
    <p class="hero-sub" data-i18n="riddleHeroSub">A new riddle every month. You'll need the book to solve it.</p>
  </section>

  <!-- Riddles (Mare App 4) — riddle.js. Answers are checked on the
       server; the page never contains them. -->
  <p class="riddle-sparkles" id="riddle-sparkles" hidden></p>
  <div class="riddle-card" id="riddle-card" hidden>
    <h2 id="riddle-title"></h2>
    <p class="riddle-intro" id="riddle-intro"></p>
    <div id="riddle-steps"></div>

    <div class="riddle-code">
      <p class="riddle-code-label" id="riddle-code-label"></p>
      <div class="riddle-row">
        <input type="text" id="riddle-code" autocomplete="off" maxlength="40">
        <button type="button" class="btn-primary" id="riddle-code-btn" data-i18n="riddleCheckCode">Check my code</button>
      </div>
      <p class="riddle-feedback" id="riddle-code-feedback" hidden></p>
    </div>

    <div class="riddle-reward" id="riddle-reward" hidden>
      <p id="riddle-reward-text"></p>
      <div class="home-notice-code" id="riddle-promo-row" hidden>
        <span class="home-notice-code-text" id="riddle-promo"></span>
        <button type="button" class="btn-ghost home-notice-copy" id="riddle-promo-copy" data-i18n="homeNoticeCopy">Copy code</button>
      </div>
      <p><a class="btn-primary" href="/merchandise.html" data-i18n="riddleShopBtn">Visit Mare's Shop</a></p>
    </div>

    <div class="riddle-join" id="riddle-join" hidden>
      <p id="riddle-join-text"></p>
      <a class="btn-primary" id="riddle-join-btn" href="/login.html?mode=signup" data-i18n="showcaseRegister">Register</a>
    </div>
  </div>
  <p class="riddle-none" id="riddle-none" hidden data-i18n="riddleNone">A new riddle is on its way — keep your detective skills sharp.</p>

  <p style="text-align:center;margin:26px 0 8px;"><a class="btn-ghost" href="/club-mare.html" data-i18n="forestBackToClub">← Back to Club Mare</a></p>
</main>

<script src="/js/i18n.js"></script>
<script src="/js/mare-helper-widget.js"></script>
<script src="/js/bg-slideshow.js"></script>
<script src="/js/riddle.js"></script>
<script>window.MareBgSlideshow.init('bg-slideshow', ['/images/mare-front-cover.jpg']);</script>
</body>
</html>
