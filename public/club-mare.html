<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mare — Club Mare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/day.css">
</head>
<body class="day auth-atmosphere">

<div class="bg-slideshow-wrap" id="bg-slideshow"></div>
<div class="bg-veil"></div>

<header class="topbar">
  <a href="/library.html" class="brand" style="text-decoration:none;">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="28" height="28"><path d="M20 4c-7 0-13 6-13 14 0 9 8 15 13 18 5-3 13-9 13-18 0-8-6-14-13-14z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="17" r="3" fill="currentColor"/></svg>
    </span>
    <span class="brand-word" data-i18n="brand">Mare</span>
  </a>
  <nav class="topbar-actions">
    <div class="lang-switch" id="lang-switch" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="nl">NL</button>
    </div>
    <a href="/library.html" class="btn-ghost" data-i18n="backToStories">Back to stories</a>
  </nav>
</header>

<main class="shop-main">

  <section class="hero">
    <h1 data-i18n="clubMareTitle">Club Mare</h1>
    <p class="hero-sub" data-i18n="clubMareSub">New stories, just for members</p>
  </section>

  <!-- Signed out -->
  <section id="cm-signed-out-view" hidden>
    <div class="showcase-tile" style="max-width:360px;margin:0 auto;cursor:default;">
      <p style="color:var(--parchment);margin-bottom:14px;" data-i18n="clubMareSignInPrompt">Sign in as a parent to join Club Mare.</p>
      <a href="/login.html" class="btn-primary btn-full" data-i18n="signIn">Sign in</a>
    </div>
  </section>

  <!-- Not yet a member -->
  <section id="cm-join-view" hidden>
    <div class="showcase-tile" style="max-width:360px;margin:0 auto;cursor:default;">
      <p style="color:var(--parchment);margin-bottom:14px;" data-i18n="clubMareJoinPrompt">Free to join — new stories and updates from the wood.</p>
      <button type="button" class="btn-primary btn-full" id="cm-join-btn" data-i18n="clubMareJoinButton">Join Club Mare — it's free</button>
    </div>
  </section>

  <!-- Member view -->
  <section id="cm-member-view" hidden>
    <p class="clubmare-tier-note" id="cm-tier-note"></p>
    <div class="clubmare-posts" id="cm-posts-list"></div>
  </section>

</main>

<script src="/js/i18n.js"></script>
<script src="/js/mare-helper-widget.js"></script>
<script src="/js/bg-slideshow.js"></script>
<script src="/js/club-mare.js"></script>
<script>window.MareBgSlideshow.init('bg-slideshow', ['/images/mare-front-cover.jpg', '/images/mare-back-cover.jpg']);</script>
</body>
</html>
