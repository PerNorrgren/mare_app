<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mare — Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/reader.css">
</head>
<body class="reader-body">

<div class="reader-shell" id="reader-shell" hidden>

  <header class="reader-topbar">
    <button type="button" class="reader-icon-btn" id="back-btn" aria-label="Back" data-i18n-aria="readerBack">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="reader-book-title" id="reader-book-title"></span>
    <button type="button" class="reader-icon-btn" id="toc-btn" aria-label="Chapters" data-i18n-aria="readerChapters">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main class="reader-stage-wrap">
    <div class="reader-stage" id="reader-stage">
      <img class="reader-scene-image" id="scene-image" alt="">
      <div class="reader-hotspot-layer" id="hotspot-layer"></div>
      <div class="reader-text-overlay" id="text-overlay" hidden>
        <p class="reader-text-line" id="text-line"></p>
      </div>
      <button type="button" class="reader-edge-tap reader-edge-tap-prev" id="edge-prev" aria-label="Previous" data-i18n-aria="readerPrevious"></button>
      <button type="button" class="reader-edge-tap reader-edge-tap-next" id="edge-next" aria-label="Next" data-i18n-aria="readerNext"></button>
    </div>
  </main>

  <footer class="reader-controls">
    <button type="button" class="reader-nav-btn" id="prev-btn" aria-label="Previous scene" data-i18n-aria="readerPreviousScene">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" class="reader-play-btn" id="play-btn" aria-label="Play" data-i18n-aria="readerPlay">
      <svg class="icon-play" viewBox="0 0 24 24" width="26" height="26"><path d="M8 5l12 7-12 7z" fill="currentColor"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" width="26" height="26" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
    </button>
    <button type="button" class="reader-nav-btn" id="next-btn" aria-label="Next scene" data-i18n-aria="readerNextScene">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="reader-controls-right">
      <button type="button" class="reader-toggle-btn" id="text-toggle-btn" aria-label="Show text" data-i18n-aria="readerToggleText">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="reader-toggle-btn" id="music-toggle-btn" aria-label="Mute music" data-i18n-aria="readerToggleMusic">
        <svg class="icon-sound-on" viewBox="0 0 24 24" width="18" height="18"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8a5 5 0 010 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="icon-sound-off" viewBox="0 0 24 24" width="18" height="18" hidden><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M15 9l5 5M20 9l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </footer>

  <!-- TOC panel -->
  <div class="reader-toc-panel" id="toc-panel" hidden>
    <div class="reader-toc-header">
      <span data-i18n="readerChapters">Chapters</span>
      <button type="button" class="reader-icon-btn" id="toc-close-btn" aria-label="Close" data-i18n-aria="readerClose">✕</button>
    </div>
    <div class="reader-toc-list" id="toc-list"></div>
  </div>

  <!-- Hotspot popup modal -->
  <div class="reader-modal-backdrop" id="hotspot-modal" hidden>
    <div class="reader-modal-card">
      <img class="reader-modal-image" id="hotspot-modal-image" alt="" hidden>
      <p class="reader-modal-text" id="hotspot-modal-text"></p>
      <button type="button" class="btn-primary" id="hotspot-modal-close" data-i18n="readerClose">Close</button>
    </div>
  </div>

  <!-- Resume-progress prompt -->
  <div class="reader-modal-backdrop" id="resume-prompt" hidden>
    <div class="reader-modal-card">
      <p class="reader-modal-text" data-i18n="readerResumePrompt">Continue where you left off?</p>
      <div class="reader-modal-actions">
        <button type="button" class="btn-ghost" id="resume-restart-btn" data-i18n="readerStartOver">Start from the beginning</button>
        <button type="button" class="btn-primary" id="resume-continue-btn" data-i18n="readerContinue">Continue</button>
      </div>
    </div>
  </div>

</div>

<div class="reader-loading" id="reader-loading">
  <div class="reader-loading-spinner"></div>
</div>

<script src="/js/i18n.js"></script>
<script src="/js/reader.js"></script>
</body>
</html>
