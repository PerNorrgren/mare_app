<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mare — Reset password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/day.css">
</head>
<body class="day auth-atmosphere">

<div class="bg-slideshow-wrap" id="bg-slideshow"></div>
<div class="bg-veil"></div>

<header class="topbar">
  <a href="/" class="brand" style="text-decoration:none;">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="28" height="28"><path d="M20 4c-7 0-13 6-13 14 0 9 8 15 13 18 5-3 13-9 13-18 0-8-6-14-13-14z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="17" r="3" fill="currentColor"/></svg>
    </span>
    <span class="brand-word" data-i18n="brand">Mare</span>
  </a>
  <nav class="topbar-actions">
    <div class="lang-switch" id="lang-switch" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="nl">NL</button>
    </div>
  </nav>
</header>

<main class="auth-main">
  <div class="auth-card">

    <h1 data-i18n="resetPasswordHeading">Choose a new password</h1>

    <form id="reset-form" novalidate>
      <div class="field">
        <label for="f-password" data-i18n="fieldNewPassword">New password</label>
        <input type="password" id="f-password" name="password" autocomplete="new-password" required minlength="8">
      </div>
      <div class="field">
        <label for="f-confirm" data-i18n="fieldConfirmPassword">Confirm password</label>
        <input type="password" id="f-confirm" name="confirm" autocomplete="new-password" required minlength="8">
      </div>
      <p class="form-error" id="form-error" hidden></p>
      <button type="submit" class="btn-primary btn-full" id="submit-btn" data-i18n="resetPasswordSubmit">Set new password</button>
    </form>

    <div id="reset-success" hidden>
      <p class="form-success" data-i18n="resetPasswordSuccess">Your password has been changed. You can sign in now.</p>
      <a class="btn-primary btn-full" id="success-login-link" href="/login.html" data-i18n="submitLogin">Log in</a>
    </div>

    <div id="reset-invalid" hidden>
      <p class="form-error" data-i18n="resetPasswordInvalid">This reset link is invalid or has expired. Request a new one from the sign-in page.</p>
      <a class="btn-primary btn-full" id="invalid-login-link" href="/login.html" data-i18n="backToLoginLink">Back to sign in</a>
    </div>

  </div>
</main>

<script src="/js/i18n.js"></script>
<script src="/js/bg-slideshow.js"></script>
<script src="/js/reset-password.js"></script>
<script>window.MareBgSlideshow.init('bg-slideshow', ['/images/mare-front-cover.jpg', '/images/mare-back-cover.jpg']);</script>
</body>
</html>
