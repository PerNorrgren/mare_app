<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mare — Teacher sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/day.css">
</head>
<body class="day auth-atmosphere">

<div class="bg-slideshow-wrap" id="bg-slideshow"></div>
<div class="bg-veil"></div>

<header class="topbar">
  <a href="/" class="brand" style="text-decoration:none;">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="28" height="28"><path d="M20 4c-7 0-13 6-13 14 0 9 8 15 13 18 5-3 13-9 13-18 0-8-6-14-13-14z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="17" r="3" fill="currentColor"/></svg>
    </span>
    <span class="brand-word" data-i18n="brand">Mare</span>
  </a>
  <nav class="topbar-actions">
    <div class="lang-switch" id="lang-switch" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="nl">NL</button>
    </div>
    <a href="/teacher.html" class="btn-ghost" data-i18n="backToTeacher">Back to Mare in the Classroom</a>
  </nav>
</header>

<main class="auth-main">
  <div class="auth-card">

    <h1 id="auth-heading" data-i18n="authHeadingLogin">Sign in</h1>
    <p class="auth-sub" id="auth-sub" data-i18n="subTeacherLogin">Sign in to your teacher account.</p>

    <div class="mode-switch">
      <button type="button" class="mode-btn active" data-mode="login" data-i18n="modeLogin">Log in</button>
      <button type="button" class="mode-btn" data-mode="signup" data-i18n="modeSignup">Create account</button>
    </div>

    <form id="auth-form" novalidate>
      <div class="field signup-only" hidden>
        <label for="f-name" data-i18n="fieldName">Name</label>
        <input type="text" id="f-name" name="name" autocomplete="name">
      </div>
      <div class="field signup-only" hidden>
        <label for="f-school" data-i18n="fieldSchool">School (optional)</label>
        <input type="text" id="f-school" name="school" autocomplete="organization">
      </div>
      <div class="field">
        <label for="f-email" data-i18n="fieldEmail">Email</label>
        <input type="email" id="f-email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="f-password" data-i18n="fieldPassword">Password</label>
        <input type="password" id="f-password" name="password" autocomplete="current-password" required>
      </div>
      <div class="field signup-only" hidden>
        <label for="f-confirm" data-i18n="fieldConfirmPassword">Confirm password</label>
        <input type="password" id="f-confirm" name="confirm" autocomplete="new-password">
      </div>

      <p class="form-error" id="form-error" hidden></p>

      <button type="submit" class="btn-primary btn-full" id="submit-btn" data-i18n="submitLogin">Log in</button>
    </form>

    <p class="auth-links login-only"><a href="#" id="forgot-link" data-i18n="forgotPasswordLink">Forgot your password?</a></p>

    <form id="forgot-form" novalidate hidden>
      <p class="auth-sub" data-i18n="forgotPasswordSub">Enter your email and we'll send you a link to reset your password.</p>
      <div class="field">
        <label for="fp-email" data-i18n="fieldEmail">Email</label>
        <input type="email" id="fp-email" name="email" autocomplete="email" required>
      </div>
      <p class="form-error" id="forgot-error" hidden></p>
      <p class="form-success" id="forgot-success" hidden data-i18n="forgotPasswordSent">If that email has an account, a reset link is on its way.</p>
      <button type="submit" class="btn-primary btn-full" id="forgot-submit-btn" data-i18n="forgotPasswordSubmit">Send reset link</button>
      <p class="auth-links"><a href="#" id="back-to-login-link" data-i18n="backToLoginLink">Back to sign in</a></p>
    </form>

  </div>
</main>

<script src="/js/i18n.js"></script>
<script src="/js/bg-slideshow.js"></script>
<script src="/js/teacher-login.js"></script>
<script>window.MareBgSlideshow.init('bg-slideshow', ['/images/mare-front-cover.jpg', '/images/mare-back-cover.jpg']);</script>
</body>
</html>
